{% from "_nav.html" import main_links %}
<header class="site-header">
<div class="wrap">
<a class="logo" href="/" aria-label="CarRec home"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="currentColor"/><path d="M8 19.5l2-5.2c.4-1 1.3-1.6 2.3-1.6h7.4c1 0 1.9.6 2.3 1.6l2 5.2v3.3a1 1 0 0 1-1 1h-1.3a1 1 0 0 1-1-1v-1H11.3v1a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z" fill="#fff"/><circle cx="11.6" cy="18.6" r="1.3" fill="currentColor"/><circle cx="20.4" cy="18.6" r="1.3" fill="currentColor"/></svg> CarRec</a>
<div class="hdr-right">
<nav class="nav" aria-label="Main">{{ main_links('project', used_cars_enabled) }}</nav>
<button class="btn" id="themebtn" type="button"><span class="lbl">Theme: </span>Auto</button>
</div>
</div>
<div class="subbar"><div class="wrap subrow">
<nav class="nav subnav" aria-label="Project pages">
<a href="/project"{% if current == '' %} aria-current="page"{% endif %}>Overview</a>
<a href="/project/pipeline"{% if current == 'pipeline' %} aria-current="page"{% endif %}>Pipeline</a>
<a href="/project/knowledge-base"{% if current == 'knowledge-base' %} aria-current="page"{% endif %}>Knowledge base</a>
<a href="/project/engine"{% if current == 'engine' %} aria-current="page"{% endif %}>Engine</a>
</nav>
</div></div>
<style>
/* the divider spans the full width, like the header's own bottom border */
.subbar{border-top:1px solid var(--line)}
.site-header .wrap.subrow{min-height:0;height:auto;padding-block:0;display:block}
.subnav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-block:4px;max-width:100%}
.subnav::-webkit-scrollbar{display:none}
.subnav a{flex:none;font-size:.8125rem;padding:6px 12px}
@media (max-width:760px){.site-header .wrap.subrow{height:auto;padding-block:0}.subnav{-webkit-mask-image:none;mask-image:none;padding-inline:0}}
@media (max-width:420px){.hdr-right .nav-extra{display:none}}
/* a phone fits the logo, both main links and the theme button without the main nav having to scroll */
@media (max-width:380px){.hdr-right .nav a{padding-inline:5px;font-size:.75rem}}
@media (max-width:480px){.hdr-right .nav a{padding-inline:7px}.hdr-right .nav{-webkit-mask-image:none;mask-image:none;padding-inline:0}}
</style>
</header>
