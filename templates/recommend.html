<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results | CarRec</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"DM Sans"', 'sans-serif'],
              display: ['"Space Grotesk"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              base: { 950: '#0a0a0a', 900: '#121212', 800: '#1a1a1a', 700: '#262626', 300: '#d4d4d4', 200: '#e5e5e5', 100: '#f5f5f5', 50: '#fafafa' },
              cyan: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2', 900: '#164e63' },
              danger: { 400: '#f87171', 500: '#ef4444', 900: '#7f1d1d' }
            }
          }
        }
      }
    </script>
</head>
<body class="bg-base-950 text-base-100 font-sans antialiased min-h-screen flex flex-col selection:bg-cyan-500/30">
    <header class="fixed top-0 w-full z-50 bg-base-950/80 backdrop-blur-md border-b border-base-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="font-display font-bold text-2xl tracking-tight text-white flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-cyan-500"></div> CarRec
            </a>
            <nav class="flex items-center gap-6 font-mono text-sm">
                <a href="/" class="text-cyan-400">/new_cars</a>
                {% if used_cars_enabled %}
                <a href="/used" class="text-base-300 hover:text-cyan-400 transition-colors">/used_cars</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="flex-1 w-full max-w-7xl mx-auto px-4 md:px-6 pt-24 pb-20 flex flex-col">
        <form onsubmit="sendQuery(event)" class="w-full max-w-4xl mx-auto mb-12">
            <div class="bg-base-900 border border-base-800 rounded-xl p-2 flex flex-wrap sm:flex-nowrap items-center shadow-lg focus-within:border-cyan-500/50 transition-colors">
                <label for="userQuery" class="sr-only">Query</label>
                <span class="pl-4 pr-2 text-base-700 font-mono text-sm">~/query $</span>
                <input id="userQuery" type="text" class="flex-1 min-w-0 bg-transparent text-white font-mono text-sm md:text-base px-2 py-3 outline-none placeholder-base-700" placeholder="Enter parameters...">
                <button type="submit" class="w-full sm:w-auto mt-2 sm:mt-0 sm:ml-2 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 font-mono text-sm px-6 py-3 rounded-lg transition-all">Run</button>
            </div>
            <div data-suggestions class="mt-3 flex flex-wrap gap-2 justify-center" aria-label="Suggested searches"></div>
        </form>
        <div id="results" class="w-full flex flex-col gap-8" aria-live="polite"></div>
        <form id="followup" hidden onsubmit="sendFollowup(event)" class="w-full max-w-4xl mx-auto mt-10">
            <div class="bg-base-900 border border-base-800 rounded-xl p-2 flex flex-wrap sm:flex-nowrap items-center shadow-lg focus-within:border-cyan-500/50 transition-colors">
                <label for="followupQuery" class="sr-only">Follow-up query</label>
                <span class="pl-4 pr-2 text-base-700 font-mono text-sm">~/next $</span>
                <input id="followupQuery" type="text" class="flex-1 min-w-0 bg-transparent text-white font-mono text-sm md:text-base px-2 py-3 outline-none placeholder-base-700" placeholder="Try another search...">
                <button type="submit" class="w-full sm:w-auto mt-2 sm:mt-0 sm:ml-2 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 font-mono text-sm px-6 py-3 rounded-lg transition-all">Run</button>
            </div>
            <div data-suggestions data-count="3" class="mt-3 flex flex-wrap gap-2 justify-center" aria-label="Suggested searches"></div>
            <div class="mt-4 flex justify-center">
                <button type="button" data-new-search class="font-mono text-xs px-4 py-2 rounded-md border border-base-700 text-base-200 hover:border-danger-400/50 hover:text-danger-400 transition-colors">New search</button>
            </div>
        </form>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>document.addEventListener("DOMContentLoaded", initNewCarPage);</script>
</body>
</html>
