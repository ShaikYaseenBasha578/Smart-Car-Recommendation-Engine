<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a car | CarRec</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% set active = 'search' %}{% include "_header.html" %}
    <main class="results-page">
        <div class="wrap">
            <form onsubmit="sendQuery(event)" class="search-form" role="search">
                <h1 class="page-title">What are you looking for?</h1>
                <div class="search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                    <label for="userQuery" class="sr-only">Describe the car you want</label>
                    <input id="userQuery" type="search" autocomplete="off" placeholder="e.g. 7 seater diesel for the family">
                    <button type="submit" class="btn btn-primary">Find cars</button>
                </div>
                <div data-suggestions class="chips" aria-label="Example searches"></div>
            </form>
            <div id="results" class="thread" aria-live="polite"></div>
            <form id="followup" hidden onsubmit="sendFollowup(event)" class="followup search-form" role="search">
                <h2>Try another search</h2>
                <div class="search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                    <label for="followupQuery" class="sr-only">Another search</label>
                    <input id="followupQuery" type="search" autocomplete="off" placeholder="e.g. same budget, but automatic">
                    <button type="submit" class="btn btn-primary">Find cars</button>
                </div>
                <div data-suggestions data-count="3" class="chips" aria-label="Example searches"></div>
                <div class="followup-foot">
                    <button type="button" data-new-search class="btn btn-quiet">New search</button>
                </div>
            </form>
        </div>
    </main>
    <footer class="site-footer">
        <div class="wrap">Prices are ex-showroom. Car images are taken from manufacturer brochures.</div>
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>document.addEventListener("DOMContentLoaded", initNewCarPage);</script>
</body>
</html>
